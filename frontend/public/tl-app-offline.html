<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You are offline</title>
<style>
  html,body{margin:0;height:100%;background:#EFF3F1;color:#22333B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
  h1{font-size:22px;margin:0}
  p{margin:0;color:#56666E;max-width:320px;line-height:1.5}
  button{margin-top:12px;font:inherit;font-weight:600;padding:12px 22px;border-radius:10px;border:0;background:#22333B;color:#fff}
</style>
</head>
<body>
<main>
  <div style="font-size:44px" aria-hidden="true">📡</div>
  <h1>You are offline</h1>
  <p>No internet connection right now. Your work is safe on the server. Check your signal or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
