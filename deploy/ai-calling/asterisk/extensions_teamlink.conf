; ---------------------------------------------------------------------------
; TeamLink self-hosted AI calling - dialplan (template).
; Include from /etc/asterisk/extensions.conf:   #include extensions_teamlink.conf
;
; An outbound AI call is placed by an AMI Originate (Phase 3, not built yet), for example:
;   Action: Originate
;   Channel: PJSIP/<10-digit number>@synway
;   Context: teamlink-ai
;   Exten: s
;   Priority: 1
;   Variable: AICALL_UUID=<the call's callSid in TeamLink>
;   Async: true
; When the candidate answers, Asterisk runs [teamlink-ai] and AudioSocket connects the call to the TeamLink bridge
; (backend/src/calling/local/audioSocket.js), which runs the whole conversation and saves the result.
; ---------------------------------------------------------------------------

[teamlink-ai]
exten => s,1,NoOp(TeamLink AI call ${AICALL_UUID})
 same => n,Answer()
 same => n,Set(TIMEOUT(absolute)=600)                       ; never longer than 10 minutes
 same => n,AudioSocket(${AICALL_UUID},127.0.0.1:9092)        ; = AI_CALL_AUDIOSOCKET_HOST:AI_CALL_AUDIOSOCKET_PORT
 same => n,Hangup()

[teamlink-ai-in]
; calls coming IN from the gateway are not handled by the AI
exten => _X.,1,Hangup(21)
