; ---------------------------------------------------------------------------
; TeamLink self-hosted AI calling - SIP trunk to the Synway gateway (template).
; Fill in SYNWAY_LAN_IP from the gateway's admin page. The gateway sits on the office LAN, so no SIP registration or
; password goes over the internet: the trunk is identified by its IP.
; Include from /etc/asterisk/pjsip.conf:   #include pjsip_synway.conf
; ---------------------------------------------------------------------------

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[synway]
type=endpoint
transport=transport-udp
context=teamlink-ai-in          ; calls FROM the gateway (not used by AI calling; keep them out of other contexts)
disallow=all
allow=alaw,ulaw                 ; Indian telecom lines: A-law first
aors=synway
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733

[synway]
type=aor
contact=sip:SYNWAY_LAN_IP:5060
qualify_frequency=30

[synway]
type=identify
endpoint=synway
match=SYNWAY_LAN_IP
