; Manual browser calling: only a registered browser extension can reach this context, only Indian mobile numbers, only with a call token.
; PHONE LINES (23 Nov 2026): the TeamLink server picks the line of each call and the browser sends it in the X-TL-Line header. Only a-z and
; 0-9 are kept, and the value is used only when [tl-line-route] (extensions_tl_lines.conf, generated by the backend) has that extension;
; anything else goes out on "default" = the office Synway (teamlink-gw). If extensions_tl_lines.conf is not included yet, the call
; goes straight to teamlink-gw exactly as before.
[browser-out]
exten => _[6-9]XXXXXXXXX,1,NoOp(browser call from ${CALLERID(num)})
 same => n,Set(TLTOKEN=${PJSIP_HEADER(read,X-TL-Call)})
 same => n,GotoIf($["${TLTOKEN}"=""]?deny)
 same => n,Set(TLLINE=${FILTER(a-z0-9,${PJSIP_HEADER(read,X-TL-Line)})})
 same => n,GotoIf($["${TLLINE}"=""]?usedefault)
 same => n,GotoIf(${DIALPLAN_EXISTS(tl-line-route,${TLLINE},1)}?route)
 same => n(usedefault),Set(TLLINE=default)
 same => n,GotoIf(${DIALPLAN_EXISTS(tl-line-route,default,1)}?route)
 same => n,UserEvent(TLCall,Token: ${TLTOKEN},Ext: ${CALLERID(num)},To: ${EXTEN},Line: default)
 same => n,Dial(PJSIP/${EXTEN}@teamlink-gw,45)
 same => n,Hangup()
 same => n(route),UserEvent(TLCall,Token: ${TLTOKEN},Ext: ${CALLERID(num)},To: ${EXTEN},Line: ${TLLINE})
 same => n,Gosub(tl-line-route,${TLLINE},1(${EXTEN}))
 same => n,Hangup()
 same => n(deny),Hangup(21)
exten => _X.,1,Hangup(21)
