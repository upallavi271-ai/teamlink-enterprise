; Manual browser calling (TeamLink). Included from pjsip.conf. Per-recruiter endpoints live in pjsip_browser_users.conf (generated by the backend).
[transport-ws]
type=transport
protocol=ws
bind=127.0.0.1

[webrtc-tpl](!)
type=endpoint
transport=transport-ws
context=browser-out
disallow=all
allow=alaw,ulaw
webrtc=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
; audio must use the public address: the ws transport listens on 127.0.0.1 (behind nginx) and Asterisk would otherwise bind call audio to 127.0.0.1 too (no audio either way, 23 Nov 2026)
media_address=72.61.233.104
bind_rtp_to_media_address=yes
